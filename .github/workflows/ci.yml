name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build and run test suite
        run: make -C test CC=${{ matrix.cc }}

  sanitize:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run under sanitizers
        run: >
          make -C test
          CFLAGS="-std=c11 -Wall -Wextra -O1 -g -I..
          -fsanitize=address,undefined -fsanitize=float-cast-overflow
          -fno-sanitize-recover=all"
        env:
          ASAN_OPTIONS: strict_string_checks=1:detect_stack_use_after_return=1

  strict-warnings:
    name: -Werror strict flags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Library sources compile warning-free
        run: >
          gcc -std=c11 -Werror -Wall -Wextra -Wpedantic -Wconversion
          -Wshadow -Wcast-qual -Wstrict-prototypes -Wformat=2
          -O2 -fsyntax-only sdi12_crc.c sdi12_sensor.c sdi12_master.c
      - name: Examples compile warning-free
        run: |
          for f in examples/*.c; do
            gcc -std=c11 -Werror -Wall -Wextra -I. -fsyntax-only "$f"
          done

  cmake:
    name: CMake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

  no-stdio:
    name: library has no stdio dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No stdio includes in library sources
        run: |
          # grep exits 0 on a match, 1 on none, 2 on error; only 1 passes.
          rc=0
          grep -nE '^\s*#\s*include\s*<stdio\.h>' sdi12*.c sdi12*.h libsdi12.h || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "ERROR: stdio include in library sources (grep rc=$rc)" >&2
            exit 1
          fi
      - name: No stdio symbols in compiled library
        run: |
          gcc -std=c11 -O2 -c sdi12*.c
          syms=$(nm -u sdi12*.o)
          if printf '%s\n' "$syms" | grep -E 'printf|scanf|puts|putchar|fputc|fwrite|fopen|stdout|stderr'; then
            echo "ERROR: library objects reference stdio" >&2
            exit 1
          fi
          echo "OK: no stdio in library"
